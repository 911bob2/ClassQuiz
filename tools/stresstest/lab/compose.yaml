name: classquiz-bench

x-common: &common
  cpuset: "0-3"
  restart: "no"
  logging:
    driver: local
    options: {max-size: "10m", max-file: "2"}

x-env: &env
  DB_URL: postgresql://classquiz:local-benchmark-only@db:5432/classquiz
  REDIS: redis://redis:6379/0?decode_responses=True
  SECRET_KEY: local-benchmark-only-do-not-deploy
  MAX_WORKERS: "1"
  ROOT_ADDRESS: http://127.0.0.1:18088
  MEILISEARCH_URL: http://meilisearch:7700
  TELEMETRY_ENABLED: "false"
  SKIP_EMAIL_VERIFICATION: "true"
  MAIL_PORT: "587"
  MAIL_ADDRESS: benchmark@example.invalid
  MAIL_USERNAME: disabled
  MAIL_PASSWORD: disabled
  MAIL_SERVER: smtp.invalid
  STORAGE_BACKEND: local
  STORAGE_PATH: /app/data
  PYTHONPATH: /lab:/app
  LAB_PATCHES: ${LAB_PATCHES:-baseline}
  LAB_SCALE: ${LAB_SCALE:-}
  ACCESS_LOG: ""

services:
  db:
    <<: *common
    image: postgres:16-alpine
    mem_limit: 1g
    environment:
      POSTGRES_USER: classquiz
      POSTGRES_PASSWORD: local-benchmark-only
      POSTGRES_DB: classquiz
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U classquiz -d classquiz"]
      interval: 2s
      retries: 30
  redis:
    <<: *common
    image: valkey/valkey:8-alpine
    mem_limit: 1g
    command: [valkey-server, --appendonly, "yes"]
    volumes: [redis:/data]
  meilisearch:
    <<: *common
    image: getmeili/meilisearch:v0.28.0
    mem_limit: 1g
    environment: {MEILI_NO_ANALYTICS: "true"}
  api:
    <<: *common
    image: classquiz-bench-api:local
    build: {context: ../../.., dockerfile: Dockerfile}
    mem_limit: 2g
    environment: *env
    ulimits:
      nofile: {soft: "${LAB_NOFILE:-65536}", hard: 65536}
    volumes:
      - ../../../classquiz:/app/classquiz:ro
      - .:/lab:ro
      - ./results:/results
      - uploads:/app/data
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      meilisearch: {condition: service_started}
    command: [sh, -c, "alembic upgrade head && exec gunicorn -k ${LAB_WORKER:-uvicorn.workers.UvicornWorker} -c /app/gunicorn_conf.py lab_app:app"]
  frontend:
    <<: *common
    image: classquiz-bench-frontend:local
    build:
      context: ../../../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    mem_limit: 1g
    environment:
      API_URL: http://api:80
      REDIS_URL: redis://redis:6379/0?decode_responses=True
      ORIGIN: http://127.0.0.1:18088
      BODY_SIZE_LIMIT: "104857600"
  proxy:
    <<: *common
    image: nginx:1.28-alpine
    mem_limit: 1g
    ports: [127.0.0.1:18088:8080]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api, frontend]
  runner:
    image: classquiz-bench-api:local
    profiles: [bench]
    cpuset: "4-7"
    mem_limit: 2g
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - .:/lab:ro
      - ./results:/results
    entrypoint: [python, /lab/drive.py]

volumes:
  db:
  redis:
  uploads:
