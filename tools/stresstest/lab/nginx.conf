worker_processes 4;
worker_rlimit_nofile 65536;
# Proxied WebSockets consume a client and an upstream connection each.
# Leave headroom above 10,000 clients so the lab measures the application.
events { worker_connections 16384; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api_backend {
    zone api_backend 64k;
    server api:80 resolve;
    keepalive 256;
  }
  upstream frontend_backend {
    zone frontend_backend 64k;
    server frontend:3000 resolve;
    keepalive 32;
  }
  server {
    listen 8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_read_timeout 3600s;
    location /api/ { proxy_pass http://api_backend; }
    location /__bench/ { proxy_pass http://api_backend; }
    location /socket.io/ { proxy_buffering off; proxy_pass http://api_backend; }
    location / { proxy_pass http://frontend_backend; }
  }
}
