map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;
    # Docker DNS is re-resolved so backend container replacements are safe.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:80;
    set $realtime http://realtime:81;
    set $frontend http://frontend:3000;
    set $storage http://storage:8333;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $original_scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # SvelteKit lists each page's preloaded modules in a Link response header.
    # The default 4k buffer is too small for larger pages such as /play.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location /api/ {
        proxy_pass $api;
    }
    location = /openapi.json {
        proxy_pass $api;
    }
    location /socket.io/ {
        proxy_buffering off;
        proxy_pass $api;
    }
    location /socket.io-rust/ {
        rewrite ^/socket.io-rust/(.*)$ /socket.io/$1 break;
        proxy_buffering off;
        proxy_pass $realtime;
    }
    # Only signed object reads are public. S3 administration stays private.
    # Keep the bucket path, host and query intact for AWS signature validation.
    location /classquiz/ {
        limit_except GET { deny all; }
        proxy_buffering off;
        proxy_pass $storage;
    }
    location / {
        proxy_pass $frontend;
    }
}
