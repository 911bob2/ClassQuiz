name: classquiz

x-service: &service
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-api-environment: &api-environment
  CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-hcaptcha}
  CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
  CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
  CAPTCHA_ALLOWED_HOSTNAMES: ${CAPTCHA_ALLOWED_HOSTNAMES:-quiz.911bob.dev}
  CAPTCHA_RECAPTCHA_MIN_SCORE: ${CAPTCHA_RECAPTCHA_MIN_SCORE:-0.5}
  DB_URL: postgresql://classquiz:${POSTGRES_PASSWORD:?required}@db:5432/classquiz
  REDIS: redis://redis:6379/0?decode_responses=True
  SECRET_KEY: ${SECRET_KEY:?required}
  MAX_WORKERS: "1"
  FORWARDED_ALLOW_IPS: "*"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  ROOT_ADDRESS: https://quiz.911bob.dev
  MEILISEARCH_URL: http://meilisearch:7700
  TELEMETRY_ENABLED: "false"
  SKIP_EMAIL_VERIFICATION: "true"
  MAIL_PORT: "587"
  MAIL_ADDRESS: noreply@quiz.911bob.dev
  MAIL_USERNAME: disabled
  MAIL_PASSWORD: disabled
  MAIL_SERVER: smtp.invalid
  STORAGE_BACKEND: s3
  RUST_REALTIME_URL: http://realtime:81
  S3_BASE_URL: http://storage:8333
  S3_PUBLIC_URL: https://quiz.911bob.dev
  S3_BUCKET_NAME: classquiz
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?required}

services:
  db:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: classquiz
      POSTGRES_DB: classquiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U classquiz -d classquiz"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *service
    image: valkey/valkey:8-alpine
    command: [valkey-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    <<: *service
    # ClassQuiz's search integration targets the v0.28 API.
    image: getmeili/meilisearch:v0.28.0
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes: [search-data:/data.ms]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:7700/health]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    <<: *service
    image: chrislusf/seaweedfs:4.46
    command: [mini, -dir=/data, -ip=storage, -ip.bind=0.0.0.0]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: classquiz
    volumes: [storage-data:/data]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9333/cluster/status]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  api:
    <<: *service
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    image: classquiz-backend:711bdde-local
    build:
      context: ..
      dockerfile: Dockerfile
    environment: *api-environment
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/openapi.json', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 20
      start_period: 30s

  worker:
    <<: *service
    image: classquiz-backend:711bdde-local
    environment: *api-environment
    command: [arq, classquiz.worker.WorkerSettings]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      # Read arq's heartbeat without importing the full application and S3 client.
      test: [CMD, python, -c, "import os, redis; assert redis.Redis.from_url(os.environ['REDIS']).exists('arq:queue:health-check')"]
      interval: 30s
      timeout: 5s
      retries: 5

  realtime:
    <<: *service
    image: classquiz-backend:711bdde-local
    command: [python, /app/classquiz/realtime_process.py]
    environment:
      REDIS: redis://redis:6379/0
      CLASSQUIZ_ORIGIN: https://quiz.911bob.dev
      RUST_REALTIME_THREADS: "4"
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-hcaptcha}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_ALLOWED_HOSTNAMES: ${CAPTCHA_ALLOWED_HOSTNAMES:-quiz.911bob.dev}
      CAPTCHA_RECAPTCHA_MIN_SCORE: ${CAPTCHA_RECAPTCHA_MIN_SCORE:-0.5}
      RUST_CAPTCHA_MAX_CONCURRENT: ${RUST_CAPTCHA_MAX_CONCURRENT:-128}
      RUST_CAPTCHA_QUEUE: ${RUST_CAPTCHA_QUEUE:-256}
      RUST_CAPTCHA_RPS: ${RUST_CAPTCHA_RPS:-200}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    stop_grace_period: 30s
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:81/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 8
      start_period: 30s

  frontend:
    <<: *service
    image: classquiz-frontend:711bdde-local
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    environment:
      API_URL: http://api:80
      REDIS_URL: redis://redis:6379/0?decode_responses=True
      ORIGIN: https://quiz.911bob.dev
      BODY_SIZE_LIMIT: "104857600"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    <<: *service
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    image: nginx:1.28-alpine
    networks:
      backend:
      npm:
        aliases: [classquiz-proxy]
    ports: [127.0.0.1:8088:8080]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend:
  npm:
    external: true
    name: stack_default

volumes:
  postgres-data:
  redis-data:
  search-data:
  storage-data:
