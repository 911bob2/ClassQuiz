<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>try { document.documentElement.classList.toggle("dark", localStorage.theme === "dark" || (!localStorage.theme && matchMedia("(prefers-color-scheme: dark)").matches)); } catch {}</script>
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			window.plausible =
				window.plausible ||
				function () {
					(window.plausible.q = window.plausible.q || []).push(arguments);
				};
		</script>

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		
		
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/telekom/app-icon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Telekom Quiz" />
		<meta name="application-name" content="Telekom Quiz" />
		<meta name="msapplication-TileColor" content="#e20074" />
		<meta name="theme-color" content="#ffffff" />
		%sveltekit.head%
	</head>
	<body>
		<div>%sveltekit.body%</div>
	</body>
</html>
